# The hosted cockpit: the application, its PostgreSQL database and Caddy, which
# obtains and renews the HTTPS certificate on its own. Run from this folder, on
# the server, with deploy/.env filled in from .env.production.example:
#
#   docker compose up -d --build
#
# Only Caddy is reachable from outside (ports 80 and 443). The application and
# the database talk on a private network.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hkids
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: hkids
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hkids -d hkids"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      AUTH_MODE: token
      TRUST_PROXY: "true"
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://hkids:${POSTGRES_PASSWORD}@db:5432/hkids?schema=public
      # The address of the client follow-up links the agents put in messages.
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
      # The client folders of the Administratif and the Excel exports.
      HKIDS_ARCHIVE_DIR: /app/archive
    volumes:
      # The documents issued, their numbering, the catalogue, the plans and the
      # conversations: everything that must outlive a new version of the app.
      - documents:/app/assets/documents/generated
      - appdata:/app/data
      - archive:/app/archive

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  documents:
  appdata:
  archive:
  caddy_data:
  caddy_config:

# One client company of the SaaS: its own cockpit and its own PostgreSQL,
# beside H-KIDS' on the same server. Created and upgraded by
# scripts/tenant.sh, never by hand:
#
#   sh scripts/tenant.sh create <slug> ...
#
# Nothing is shared with another company but the application image and the
# HTTPS front (the Caddy of deploy/docker-compose.yml): each company has its own
# database, documents, data and archive volumes, its own settings
# (deploy/tenants/<slug>/.env) and its own address.
#
# The services are named « cockpit » and « company-db », never « app » or « db »:
# on the shared edge network a name H-KIDS uses would make Caddy, or a
# cockpit, reach the wrong one.

services:
  company-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cockpit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Its own company's cockpit only.
    networks:
      - private

  cockpit:
    # The image H-KIDS' deployment builds (docker compose up -d --build in
    # deploy/): every company runs the same version.
    image: deploy-app:latest
    restart: unless-stopped
    # Time for the answers on their way to finish when a new version replaces
    # this one (Docker's default, 10 s, cut the agents mid-answer).
    stop_grace_period: 2m
    depends_on:
      company-db:
        condition: service_healthy
    env_file: ${TENANT_ENV_FILE:?set TENANT_ENV_FILE}
    environment:
      NODE_ENV: production
      AUTH_MODE: token
      TRUST_PROXY: "true"
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://cockpit:${POSTGRES_PASSWORD}@company-db:5432/cockpit?schema=public
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN}
      HKIDS_ARCHIVE_DIR: /app/archive
    volumes:
      - documents:/app/assets/documents/generated
      - appdata:/app/data
      - archive:/app/archive
    networks:
      private: {}
      # Caddy reaches the cockpit by this name.
      edge:
        aliases:
          - ${TENANT:?set TENANT}-app

networks:
  private: {}
  edge:
    name: hkids-edge
    external: true

volumes:
  pgdata:
  documents:
  appdata:
  archive:
